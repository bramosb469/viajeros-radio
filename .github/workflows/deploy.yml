name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "DATABASE_URL=file:./prisma/dev.db" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=https://viajerosradio.uy" >> .env
          echo "ADMIN_EMAIL=viajerosdelfolklore@hotmail.com" >> .env
          echo "ADMIN_PASSWORD=Viajerosradio21" >> .env
          echo "RADIO_STREAM_URL=http://170.249.203.186:8000/stream" >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Create Turbopack module fix
        run: |
          HASH=$(grep -oP '@prisma/client-[a-f0-9]+' .next/server/chunks/ssr/*.js 2>/dev/null | head -1 | sed 's/.*@prisma\///')
          if [ -n "$HASH" ]; then
            mkdir -p "node_modules/@prisma/$HASH"
            echo '{"name":"@prisma/'$HASH'","main":"index.js"}' > "node_modules/@prisma/$HASH/package.json"
            echo 'module.exports = require("@prisma/client");' > "node_modules/@prisma/$HASH/index.js"
            echo "Created wrapper for @prisma/$HASH"
          fi

      - name: Create deploy tar
        run: tar -czf deploy.tar.gz --exclude='node_modules/.cache' --exclude='.next/cache' .next/ prisma/ server.js package.json package-lock.json next.config.ts tsconfig.json .env node_modules/

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/home/viajeros/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
            cd /home/viajeros/nodejs-app
            kill -9 $(ps aux | grep 'node server.js' | grep -v grep | awk '{print $2}') 2>/dev/null || true
            sleep 2
            cp .env .env.backup 2>/dev/null || true
            rm -rf .next node_modules prisma standalone
            tar -xzf /home/viajeros/deploy.tar.gz -C /home/viajeros/nodejs-app
            cp .env.backup .env 2>/dev/null || true
            # Copy prebuilt binary to adapter location
            mkdir -p node_modules/@prisma/adapter-better-sqlite3/build/Release
            cp node_modules/better-sqlite3/build/Release/better_sqlite3.node node_modules/@prisma/adapter-better-sqlite3/build/Release/ 2>/dev/null || true
            # Fix Turbopack hashed module resolution
            HASH=$(grep -oP '@prisma/client-[a-f0-9]+' .next/server/chunks/ssr/*.js 2>/dev/null | head -1 | sed 's/.*@prisma\///')
            if [ -n "$HASH" ]; then
              ln -sfn client "node_modules/@prisma/$HASH"
              echo "Created symlink: @prisma/$HASH -> client"
            fi
            mkdir -p tmp
            echo "Deploy complete!"
