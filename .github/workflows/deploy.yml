name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "DATABASE_URL=file:./prisma/dev.db" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=https://viajerosradio.uy" >> .env
          echo "ADMIN_EMAIL=viajerosdelfolklore@hotmail.com" >> .env
          echo "ADMIN_PASSWORD=Viajerosradio21" >> .env
          echo "RADIO_STREAM_URL=http://170.249.203.186:8000/stream" >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Prepare standalone
        run: |
          mkdir -p standalone
          cp -r .next/standalone/* standalone/
          mkdir -p standalone/.next/static
          cp -r .next/static/* standalone/.next/static/
          cp -r public standalone/public
          mkdir -p standalone/prisma
          cp prisma/dev.db standalone/prisma/dev.db
          cp .env standalone/.env
          cp -r prisma standalone/prisma

      - name: Create deploy tar
        run: tar -czf deploy.tar.gz standalone/

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/home/viajeros/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
            cd /home/viajeros/nodejs-app
            kill -9 $(ps aux | grep 'node server.js' | grep -v grep | awk '{print $2}') 2>/dev/null || true
            sleep 2
            rm -rf /home/viajeros/nodejs-app/standalone
            tar -xzf /home/viajeros/deploy.tar.gz -C /home/viajeros/nodejs-app
            cd /home/viajeros/nodejs-app/standalone
            # Rebuild native better-sqlite3
            rm -f node_modules/better-sqlite3/build/Release/better_sqlite3.node
            rm -f node_modules/@prisma/adapter-better-sqlite3/build/Release/better_sqlite3.node
            cd node_modules/better-sqlite3 && npm run build-release && cd /home/viajeros/nodejs-app/standalone
            cp node_modules/better-sqlite3/build/Release/better_sqlite3.node node_modules/@prisma/adapter-better-sqlite3/build/Release/
            # Copy env and db
            cp ../.env .env
            mkdir -p prisma && cp ../prisma/dev.db prisma/dev.db
            mkdir -p tmp
            PORT=3000 nohup node server.js > /dev/null 2>&1 &
            echo "Deploy complete!"
